[package]
name = "acrm"
version = "0.1.0"
edition = "2024"
description = "Agent-friendly personal CRM — CLI & TUI"
license = "MIT"
repository = "https://github.com/TheThoughtagen/agenticcrm"
homepage = "https://github.com/TheThoughtagen/agenticcrm"
readme = "README.md"
keywords = ["crm", "contacts", "mcp", "cli", "carddav"]
categories = ["command-line-utilities"]
rust-version = "1.85"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
colored = "3"
dirs = "6"
walkdir = "2"
anyhow = "1"
serde_json = "1"
regex = "1"
dialoguer = "0.11"
calcard = "0.3.2"
reqwest = { version = "0.13.2", features = ["blocking"] }
quick-xml = { version = "0.39.2", features = ["serialize"] }
url = "2.5.8"
toml = "0.8"
ratatui = "0.29"
thiserror = "2.0.18"
rmcp = { version = "1.1", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
tokio = { version = "1", features = ["full"] }
axum = "0.8"
schemars = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio-util = "0.7.18"
csv = "1.4.0"

[dev-dependencies]
tempfile = "3.26.0"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", features = ["linux-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }

[workspace.metadata.dist]
cargo-dist-version = "0.31.0"
ci = ["github"]
installers = ["shell", "powershell", "homebrew"]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
tap = "TheThoughtagen/homebrew-tap"
publish-jobs = ["homebrew"]
pr-run-mode = "plan"
install-updater = true
allow-dirty = ["ci"]
